name: lubelogger
description: "LubeLogger mobile app — local-first vehicle maintenance tracker."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7
  hooks_riverpod: ^3.4.3
  flutter_hooks: ^0.21.0

  # Navigation
  go_router: ^18.0.1

  # Local storage
  drift: ^2.22.0
  drift_flutter: ^0.3.1

  # HTTP
  dio: ^5.7.0

  # Domain models
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  # Connectivity
  connectivity_plus: ^7.3.1

  # Settings
  shared_preferences: ^2.3.0

  # Markdown
  flutter_markdown_plus: 1.0.12

  # Charts
  fl_chart: ^1.2.0

  # Internationalisation
  intl: ^0.20.3

  # UUID
  uuid: ^4.5.0

  # Fonts
  google_fonts: ^8.2.1

  # Image picker
  image_picker: ^1.1.2

  # Notifications
  flutter_local_notifications: ^22.3.1
  app_badge_plus: ^1.2.7
  timezone: ^0.11.1

  # App shortcuts
  quick_actions: ^1.0.7

  # Export / Import
  path_provider: ^2.1.0
  share_plus: ^13.3.0
  file_picker: ^13.0.0
  csv: ^8.0.0

  cupertino_icons: ^1.0.8
  material_symbols_icons: ^4.2906.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.0
  drift_dev: ^2.22.0
  riverpod_generator: ^4.0.9
  freezed: ^4.0.1
  json_serializable: ^6.8.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
